name: context-input-evals

on:
  pull_request:
    paths:
      - "scripts/context_input_evals/**"
      - ".github/workflows/context-input-evals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/context_input_evals/tests -v
      - run: python -m scripts.context_input_evals self-check --run-dir .context-dev/e0-ci
